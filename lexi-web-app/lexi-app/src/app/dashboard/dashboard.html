<div class="layout-wrapper">
  <div class="layout-body">
    <div class="sidebar-overlay"
      [class.active]="sidebarService.isOpen()"
      (click)="sidebarService.toggle()">
    </div>

    <app-sidebar
      [isChatHistoryOpen]="showChatHistory"
      [class.is-ready]="sidebarReady"
      [class.sidebar-hidden]="!sidebarService.isOpen()"
      (deleteModalOpen)="openDeleteModal($event)"
      (logoutModalOpen)="openLogoutModal()"
      (openChatHistory)="openChatHistory()"
      (newChat)="onNewChat()"
      (conversationSelected)="onConversationSelected($event)">
    </app-sidebar>

    <div class="main-area">
      <app-navbar></app-navbar>
      <main class="main-content">
        @if (showChatHistory) {
          <app-chat-history
            (back)="closeChatHistory()"
            (newChat)="onNewChat()"
            (conversationSelected)="onConversationSelected($event)">
          </app-chat-history>
        } @else {
          <app-chat (conversationUpdated)="onConversationUpdated()"></app-chat>
        }
      </main>
    </div>
  </div>

  <app-toast-container/>

  @if (showDeleteModal) {
    <app-modal
      title="Delete Chat"
      message="Are you sure you want to delete this chat? This action cannot be undone."
      confirmText="Delete"
      (confirmed)="confirmDelete()"
      (cancelled)="cancelDelete()">
    </app-modal>
  }

  @if (showLogoutModal) {
    <app-modal
      title="Log Out"
      message="Are you sure you want to log out?"
      confirmText="Log Out"
      (confirmed)="confirmLogout()"
      (cancelled)="showLogoutModal = false">
    </app-modal>
  }
</div>
