<div class="chat-history-container">
  <div class="uppper-container">
    <span>Chat History</span>
    <div class="new-chat-button">
      <button (click)="newChat.emit()"><i class="fa-solid fa-plus"></i>New Chat</button>
    </div>
  </div>
  <!-- Search Container -->
  <div class="search-container">
    <div class="search-input">
      <i class="fa-solid fa-magnifying-glass search-icon"></i>
      <input type="text" placeholder="Search conversations" class="input-search">
    </div>
  </div>
  <!-- Subtitle row — hidden when in select mode -->
  <div class="subtitle-row" *ngIf="!selectMode">
    <span class="subtitle-text">Your conversations with Lexi</span>
    <button class="select-btn" (click)="enterSelectMode()">Select</button>
  </div>
  <!-- Selection Bar — shown when in select mode -->
  <div class="selection-bar" *ngIf="selectMode">
    <div class="selection-left">
      <input type="checkbox" [checked]="allSelected" (change)="toggleSelectAll()" class="select-all-checkbox">
      <span class="selected-count">{{ selectedCount }} selected</span>
      <!-- for future enhancement -->
      <!-- <button class="selection-action" [disabled]="selectedCount === 0" title="Archive"><i class="fa-regular fa-copy"></i></button> --> 
      <button class="selection-action" [disabled]="selectedCount === 0" title="Delete"  (click)="deleteSelected()"><i class="fa-regular fa-trash-can"></i></button>
    </div>
    <button class="selection-clear" (click)="exitSelectMode()"><i class="fa-solid fa-xmark"></i></button>
  </div>
  <!-- Chat List -->
  <div class="chat-list">
    <div class="chat-item" *ngFor="let chat of chats" [class.selected]="chat.selected" [class.dropdown-open]="chat.showDropdown">
      <input type="checkbox" class="chat-checkbox" [class.always-visible]="selectMode" [(ngModel)]="chat.selected" (change)="onCheckboxChange()">
      <div class="chat-inner">
        <div class="chat-info">
          <span class="chat-title">{{ chat.title }}</span>
          <span class="chat-date">{{ chat.lastMessage }}</span>
        </div>
        <!-- Dropdown -->
        <div class="chat-options-wrapper" *ngIf="!selectMode">
          <button class="chat-options" [class.active]="chat.showDropdown" (click)="toggleDropdown(chat, $event)"><i class="fa-solid fa-ellipsis"></i></button>
          <div class="dropdown-menu" *ngIf="chat.showDropdown">
            <button class="dropdown-item" (click)="onSelect(chat)"><i class="fa-solid fa-check"></i> Select</button>
            <!-- for future enhancement -->
            <!-- <div class="dropdown-divider"></div> -->
            <!-- <button class="dropdown-item"><i class="fa-regular fa-star"></i> Star</button> -->
            <!-- <button class="dropdown-item"><i class="fa-solid fa-pencil"></i> Rename</button> -->
            <!-- <button class="dropdown-item"><i class="fa-solid fa-folder-plus"></i> Add to project</button> -->
            <div class="dropdown-divider"></div>
            <button class="dropdown-item delete" (click)="deleteChat(chat)" ><i class="fa-regular fa-trash-can"></i> Delete</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Delete Confirmation Modal -->
<app-modal
  *ngIf="showDeleteModal"
  title="Delete Chat"
  message="Are you sure you want to delete this chat? This action cannot be undone."
  confirmText="Delete"
  (confirmed)="onDeleteConfirmed()"
  (cancelled)="onDeleteCancelled()">
</app-modal>
